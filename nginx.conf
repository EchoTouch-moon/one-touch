upstream frontend_upstream {
  server frontend:80;
  keepalive 32;
}

upstream backend_upstream {
  server backend:8000;
  keepalive 32;
}

# ---------------------------------------------------------------------------
# This is the in-compose gateway. It is intentionally plain HTTP: TLS is
# normally terminated one hop in front of it (Caddy, Traefik, an nginx on the
# host, or a managed load balancer), and this file stays deployable as-is for
# a local `docker compose up`.
#
# To terminate TLS here instead, fill in your domain and certificate paths in
# the commented block at the bottom and delete this server.
# ---------------------------------------------------------------------------

server {
  listen 80 default_server;
  server_name _;

  # Upload limit for sync imports and handwriting previews.
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  location /api/ {
    proxy_pass http://backend_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ---------------------------------------------------------------------------
# Optional: terminate TLS here instead of in a reverse proxy.
#
#   1. Put your domain(s) in both server_name lines.
#   2. Point ssl_certificate / ssl_certificate_key at your own files, e.g. a
#      certbot directory (/etc/letsencrypt/live/<your-domain>/) or a Caddy
#      dump. Mount them into the container in docker-compose.yml.
#   3. Uncomment the HTTP -> HTTPS server block as well.
# ---------------------------------------------------------------------------
# server {
#   listen 80;
#   server_name your-domain.example;
#   return 301 https://$host$request_uri;
# }
#
# server {
#   listen 443 ssl;
#   http2 on;
#   server_name your-domain.example;
#
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   ssl_session_timeout 1d;
#   ssl_session_cache shared:SSL:50m;
#   ssl_session_tickets off;
#
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#   ssl_prefer_server_ciphers off;
#
#   add_header Strict-Transport-Security "max-age=63072000" always;
#
#   # ... then copy the location /api/ and location / blocks from above.
# }
