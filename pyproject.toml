[project]
name = "glm-words"
version = "0.1.0"
description = "Vocabulary learning web app with spaced repetition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.21.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
