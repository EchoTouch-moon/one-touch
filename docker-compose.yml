services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      GLM_WORDS_DATABASE_URL: sqlite+aiosqlite:////data/words.db
      GLM_WORDS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://127.0.0.1:8080,https://example.com,https://www.example.com
      GLM_WORDS_BACKUP_DIR: /data/backups
      GLM_WORDS_LOG_DIR: /data/logs
    volumes:
      - glm_words_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  glm_words_data:
